name: Android Build

on:
  push:
    branches:
      - android
  pull_request:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android Debug APK
        working-directory: src/platform/android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mgba-android-debug
          path: src/platform/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
