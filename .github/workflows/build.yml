name: Android Build

on:
  push:
    branches:
      - android
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android Debug APK
        working-directory: src/platform/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -PmgbaTargetAbi=arm64-v8a --no-daemon --stacktrace

      - name: Verify ARM64 APK
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          import shutil
          import zipfile
          from pathlib import Path
          workspace = Path(os.environ['GITHUB_WORKSPACE']).resolve()
          apks = sorted(workspace.rglob('*.apk'))
          print(f'Workspace: {workspace}')
          print(f'Generated APKs: {apks}', flush=True)
          assert apks, 'No APK found in the GitHub workspace after assembleDebug'
          digests = set()
          for apk_path in apks:
              with zipfile.ZipFile(apk_path) as apk:
                  abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
                  assert abis == {'arm64-v8a'}, f'Unexpected native ABIs in {apk_path}: {abis}'
                  assert 'lib/arm64-v8a/libmgba-android.so' in apk.namelist(), f'Missing mGBA Android native library: {apk_path}'
              digests.add(hashlib.sha256(apk_path.read_bytes()).hexdigest())
          assert len(digests) == 1, f'Multiple different APKs found: {apks}'
          destination = workspace / 'artifacts' / 'mgba-android-arm64-debug.apk'
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copy2(apks[0], destination)
          print(f'Verified ARM64 Debug APK: {destination}')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mgba-android-debug
          path: ${{ github.workspace }}/artifacts/mgba-android-arm64-debug.apk
          if-no-files-found: error
