name: Android Build

on:
  push:
    branches:
      - android
      - 'feat/**'
      - 'fix/**'
  pull_request:
    branches:
      - android
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build Android Debug APK
        working-directory: src/platform/android
        run: |
          chmod +x gradlew
          ./gradlew :app:testDebugUnitTest :app:assembleDebug -Pandroid.injected.build.abi=arm64-v8a --no-daemon --stacktrace

      - name: Verify ARM64 APK
        run: |
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          apks = sorted(Path('src/platform/android/app/build/outputs/apk').rglob('*.apk'))
          assert len(apks) == 1, f'Expected one Debug APK, found: {apks}'
          with zipfile.ZipFile(apks[0]) as apk:
              abis = {name.split('/')[1] for name in apk.namelist() if name.startswith('lib/') and name.endswith('.so')}
              assert abis == {'arm64-v8a'}, f'Unexpected native ABIs: {abis}'
              assert 'lib/arm64-v8a/libmgba-android.so' in apk.namelist(), 'Missing mGBA Android native library'
              print(f'Verified ARM64 Debug APK: {apks[0]}')
          PY

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mgba-android-debug
          path: src/platform/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
